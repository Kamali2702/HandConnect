<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Neon Aura AR - Advanced Hand Tracking</title>

<!-- =====================================================
     MEDIAPIPE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>

<style>

/* =====================================================
   GLOBAL
===================================================== */

:root {
    --accent: #00ffff;
    --accent2: #ff00ff;
    --bg: #02030b;
    --panel: rgba(5, 10, 25, 0.72);
    --border: rgba(255,255,255,0.18);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   CAMERA

   IMPORTANT:
   Camera is the FIRST visual layer.
===================================================== */

#video {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    display: block;

    visibility: visible;

    opacity: 1;

    background: #000;

    z-index: 1;

    transform: scaleX(-1);

    filter:
        brightness(0.92)
        contrast(1.05)
        saturate(1.05);
}


/* =====================================================
   BACKGROUND CANVAS

   Completely transparent.
===================================================== */

#backgroundCanvas {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 2;

    pointer-events: none;

    transform: scaleX(-1);

    background: transparent;
}


/* =====================================================
   EFFECT CANVAS
===================================================== */

#effectCanvas {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 3;

    pointer-events: none;

    transform: scaleX(-1);

    background: transparent;
}


/* =====================================================
   HUD
===================================================== */

#hud {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 20;

    width: 255px;

    transition: 0.3s;
}

.panel {

    background:
        linear-gradient(
            135deg,
            rgba(8,15,35,0.82),
            rgba(2,5,15,0.72)
        );

    border: 1px solid var(--border);

    border-radius: 17px;

    padding: 16px 18px;

    backdrop-filter: blur(18px);

    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 15px 50px rgba(0,0,0,0.5),
        inset 0 0 20px rgba(255,255,255,0.02);
}

.stat {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 8px;

    color:
        rgba(255,255,255,0.88);

    font-size: 14px;
}

.stat:last-child {
    margin-bottom: 0;
}

.value {

    color: var(--accent);

    font-weight: 700;

    text-shadow:
        0 0 8px var(--accent);
}


/* =====================================================
   ENERGY
===================================================== */

.energy-title {

    margin-top: 12px;

    margin-bottom: 6px;

    font-size: 13px;

    color: white;

    letter-spacing: 0.5px;
}

.energy-bar {

    width: 100%;

    height: 8px;

    border-radius: 10px;

    overflow: hidden;

    background:
        rgba(255,255,255,0.12);
}

.energy-fill {

    height: 100%;

    width: 20%;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #00ffff,
            #00ff88,
            #ff00cc,
            #6644ff
        );

    box-shadow:
        0 0 12px var(--accent);

    transition:
        width 0.2s ease;
}


/* =====================================================
   TOP RIGHT CONTROLS
===================================================== */

#controls {

    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 25;

    display: flex;

    flex-direction: column;

    gap: 10px;
}

.control-btn {

    border: 1px solid var(--border);

    background:
        rgba(5,10,25,0.68);

    color: white;

    padding:
        11px 17px;

    border-radius: 25px;

    cursor: pointer;

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);

    font-size: 13px;

    transition:
        0.25s ease;

    white-space: nowrap;
}

.control-btn:hover {

    background:
        rgba(255,255,255,0.15);

    transform:
        translateX(-3px);

    box-shadow:
        0 0 15px
        rgba(0,255,255,0.2);
}

.control-btn.active {

    border-color:
        rgba(0,255,255,0.4);

    box-shadow:
        0 0 15px
        rgba(0,255,255,0.15);
}


/* =====================================================
   THEME BAR
===================================================== */

#themes {

    position: fixed;

    left: 50%;

    bottom: 22px;

    transform:
        translateX(-50%);

    z-index: 25;

    display: flex;

    gap: 5px;

    max-width: 92vw;

    padding: 7px;

    border-radius: 35px;

    background:
        rgba(3,8,20,0.72);

    border:
        1px solid var(--border);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    overflow-x: auto;

    scrollbar-width: none;
}

#themes::-webkit-scrollbar {
    display: none;
}

.theme-btn {

    border:
        1px solid transparent;

    background:
        transparent;

    color: white;

    padding:
        9px 14px;

    border-radius: 25px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 600;

    white-space: nowrap;

    transition:
        0.25s ease;
}

.theme-btn:hover {

    background:
        rgba(255,255,255,0.10);
}

.theme-btn.active {

    background:
        rgba(255,255,255,0.17);

    border-color:
        rgba(255,255,255,0.3);

    box-shadow:
        0 0 15px
        rgba(255,255,255,0.08);
}


/* =====================================================
   STATUS
===================================================== */

#status {

    position: fixed;

    left: 50%;

    bottom: 82px;

    transform:
        translateX(-50%);

    z-index: 20;

    color:
        rgba(255,255,255,0.9);

    background:
        rgba(0,0,0,0.48);

    border:
        1px solid
        rgba(255,255,255,0.1);

    padding:
        8px 16px;

    border-radius: 20px;

    font-size: 12px;

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);

    white-space: nowrap;
}


/* =====================================================
   START SCREEN
===================================================== */

#startOverlay {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(30,0,80,0.42),
            rgba(0,0,0,0.96)
        );

    backdrop-filter:
        blur(12px);

    -webkit-backdrop-filter:
        blur(12px);

    transition:
        opacity 0.6s ease;
}

#startOverlay.hidden {

    opacity: 0;

    pointer-events: none;
}

.start-title {

    font-size:
        clamp(
            32px,
            6vw,
            72px
        );

    font-weight:
        300;

    letter-spacing:
        8px;

    color:
        white;

    margin-bottom:
        20px;

    text-shadow:
        0 0 12px #00ffff,
        0 0 30px #ff00ff,
        0 0 60px #6600ff;
}

.start-subtitle {

    max-width:
        550px;

    padding:
        0 20px;

    color:
        #999;

    line-height:
        1.7;

    margin-bottom:
        35px;
}

#startBtn {

    padding:
        16px 40px;

    border:
        none;

    border-radius:
        35px;

    color:
        white;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #6633ff
        );

    font-size:
        15px;

    font-weight:
        bold;

    letter-spacing:
        2px;

    cursor:
        pointer;

    box-shadow:
        0 0 25px
        rgba(255,0,204,0.55);

    transition:
        0.3s ease;
}

#startBtn:hover {

    transform:
        scale(1.06);

    box-shadow:
        0 0 40px
        rgba(255,0,204,0.8);
}

#startBtn:disabled {

    opacity:
        0.7;

    cursor:
        wait;
}


/* =====================================================
   ERROR MESSAGE
===================================================== */

#errorBox {

    display: none;

    position: fixed;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%,-50%);

    z-index: 200;

    width:
        min(90vw,450px);

    padding:
        25px;

    background:
        rgba(20,0,10,0.95);

    border:
        1px solid #ff3366;

    border-radius:
        15px;

    color:
        white;

    text-align:
        center;

    box-shadow:
        0 0 40px
        rgba(255,0,80,0.3);
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px) {

    #hud {

        top: 10px;

        left: 10px;

        width: 205px;
    }

    .panel {

        padding:

    }

    .stat {

        font-size:
            12px;
    }

    #controls {

        top: 10px;

        right: 10px;
    }

    .control-btn {

        padding:
            9px 12px;

        font-size:
            11px;
    }

    #themes {

        bottom:
            12px;

        max-width:
            96vw;
    }

    .theme-btn {

        padding:
            8px 10px;

        font-size:
            11px;
    }

    #status {

        bottom:
            65px;

        font-size:
            11px;
    }

}

</style>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById(
        "video"
    );

const bgCanvas =
    document.getElementById(
        "backgroundCanvas"
    );

const effectCanvas =
    document.getElementById(
        "effectCanvas"
    );

const bg =
    bgCanvas.getContext(
        "2d"
    );

const ctx =
    effectCanvas.getContext(
        "2d"
    );


const handsCount =
    document.getElementById(
        "handsCount"
    );

const fpsDisplay =
    document.getElementById(
        "fps"
    );

const gestureDisplay =
    document.getElementById(
        "gesture"
    );

const spreadDisplay =
    document.getElementById(
        "spread"
    );

const energyFill =
    document.getElementById(
        "energyFill"
    );

const energyText =
    document.getElementById(
        "energyText"
    );

const statusDisplay =
    document.getElementById(
        "status"
    );

const startOverlay =
    document.getElementById(
        "startOverlay"
    );

const startBtn =
    document.getElementById(
        "startBtn"
    );

const captureBtn =
    document.getElementById(
        "captureBtn"
    );

const trailBtn =
    document.getElementById(
        "trailBtn"
    );

const portalBtn =
    document.getElementById(
        "portalBtn"
    );


/* =====================================================
   VARIABLES
===================================================== */

let width =
    window.innerWidth;

let height =
    window.innerHeight;

let currentHands = [];

let particles = [];

let ripples = [];

let trailPoints = [];

let portalParticles = [];

let previousHands = [];

let previousPinch =
    [false,false];

let time = 0;

let lastTime =
    performance.now();

let fpsTime =
    performance.now();

let frames = 0;

let energy = 20;

let trailsEnabled =
    true;

let portalEnabled =
    true;

let cameraStream =
    null;

let mediaPipeHands =
    null;

let camera =
    null;


/* =====================================================
   FINGER TIPS
===================================================== */

const FINGER_TIPS =
    [4,8,12,16,20];


/* =====================================================
   THEMES
===================================================== */

let currentTheme =
    "Rainbow";


const themes = {

    Rainbow: function(t,i,total) {

        return `
            hsl(
                ${(t * 100 +
                i * (360 / total)) % 360},
                100%,
                60%
            )
        `;
    },

    Cyberpunk: function(t,i,total) {

        return i % 2 === 0
            ? "#ff00aa"
            : "#00ffff";
    },

    Lava: function(t,i,total) {

        return `
            hsl(
                ${5 + i * 10},
                100%,
                ${55 + Math.sin(t) * 10}%
            )
        `;
    },

    Ocean: function(t,i,total) {

        return `
            hsl(
                ${180 + i * 14},
                100%,
                60%
            )
        `;
    },

    Galaxy: function(t,i,total) {

        return `
            hsl(
                ${250 +
                Math.sin(t * 2 + i) * 45},
                100%,
                65%
            )
        `;
    },

    Aurora: function(t,i,total) {

        return `
            hsl(
                ${120 +
                Math.sin(t + i) * 80},
                100%,
                65%
            )
        `;
    },

    Ice: function(t,i,total) {

        return `
            hsl(
                ${185 + i * 8},
                100%,
                ${65 + Math.sin(t) * 8}%
            )
        `;
    },

    Inferno: function(t,i,total) {

        return `
            hsl(
                ${20 + i * 6},
                100%,
                60%
            )
        `;
    },

    Mystic: function(t,i,total) {

        return `
            hsl(
                ${270 +
                Math.sin(t + i) * 60},
                100%,
                65%
            )
        `;
    },

    Toxic: function(t,i,total) {

        return `
            hsl(
                ${70 + i * 10},
                100%,
                58%
            )
        `;
    }

};


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    bgCanvas.width =
        width;

    bgCanvas.height =
        height;

    effectCanvas.width =
        width;

    effectCanvas.height =
        height;

    createPortalParticles();
}

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   MATRIX
===================================================== */

let matrixDrops = [];


function createMatrix() {

    const columns =
        Math.floor(
            width / 18
        );

    matrixDrops =
        new Array(columns)
        .fill(0)
        .map(
            () =>
                Math.random()
                * height
        );
}


function drawBackground() {

    /*
       IMPORTANT:
       Clear instead of filling with black.
       This keeps camera visible.
    */

    bg.clearRect(
        0,
        0,
        width,
        height
    );


    bg.font =
        "16px monospace";


    for (
        let i = 0;
        i < matrixDrops.length;
        i++
    ) {

        if (
            Math.random() > 0.94
        ) {

            const char =
                String.fromCharCode(
                    0x30A0 +
                    Math.random() * 96
                );


            bg.fillStyle =
                themes[currentTheme](
                    time,
                    i,
                    matrixDrops.length
                );


            bg.globalAlpha =
                0.28;


            bg.fillText(
                char,
                i * 18,
                matrixDrops[i]
            );

        }


        matrixDrops[i] +=
            1.2;


        if (
            matrixDrops[i] >
            height
        ) {

            matrixDrops[i] =
                0;

        }

    }


    bg.globalAlpha =
        1;

}


/* =====================================================
   PORTAL PARTICLES
===================================================== */

function createPortalParticles() {

    portalParticles =
        [];

    for (
        let i = 0;
        i < 80;
        i++
    ) {

        portalParticles.push({

            angle:
                Math.random()
                * Math.PI
                * 2,

            radius:
                60 +
                Math.random()
                * 180,

            speed:
                0.2 +
                Math.random()
                * 0.8,

            size:
                1 +
                Math.random()
                * 3

        });

    }

}


function drawPortal() {

    if (
        !portalEnabled ||
        currentHands.length < 2
    ) {
        return;
    }


    const h1 =
        currentHands[0];

    const h2 =
        currentHands[1];


    const p1 =
        mapPoint(
            h1[8]
        );

    const p2 =
        mapPoint(
            h2[8]
        );


    const cx =
        (p1.x + p2.x) / 2;

    const cy =
        (p1.y + p2.y) / 2;


    const distanceHands =
        Math.hypot(
            p1.x - p2.x,
            p1.y - p2.y
        );


    const radius =
        Math.max(
            40,
            Math.min(
                distanceHands * 0.55,
                240
            )
        );


    ctx.save();


    ctx.translate(
        cx,
        cy
    );


    ctx.rotate(
        time * 0.4
    );


    for (
        let ring = 0;
        ring < 3;
        ring++
    ) {

        ctx.beginPath();


        ctx.arc(
            0,
            0,
            radius +
            ring * 14,
            0,
            Math.PI * 2
        );


        ctx.strokeStyle =
            themes[currentTheme](
                time,
                ring,
                3
            );


        ctx.lineWidth =
            3;


        ctx.shadowBlur =
            20;


        ctx.shadowColor =
            ctx.strokeStyle;


        ctx.globalAlpha =
            0.65 -
            ring * 0.15;


        ctx.stroke();

    }


    for (
        let i = 0;
        i < portalParticles.length;
        i++
    ) {

        const p =
            portalParticles[i];


        const a =
            p.angle +
            time * p.speed;


        const x =
            Math.cos(a)
            * (
                radius +
                Math.sin(
                    time * 2 + i
                ) * 15
            );

        const y =
            Math.sin(a)
            * (
                radius +
                Math.sin(
                    time * 2 + i
                ) * 15
            );


        ctx.beginPath();


        ctx.arc(
            x,
            y,
            p.size,
            0,
            Math.PI * 2
        );


        ctx.fillStyle =
            themes[currentTheme](
                time,
                i,
                5
            );


        ctx.globalAlpha =
            0.8;


        ctx.fill();

    }


    ctx.restore();

    ctx.globalAlpha =
        1;

}


/* =====================================================
   POINT MAPPING
===================================================== */

function mapPoint(point) {

    return {

        x:
            point.x * width,

        y:
            point.y * height

    };

}


/* =====================================================
   DISTANCE
===================================================== */

function distance(a,b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(
    x,
    y,
    color,
    amount = 2
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (Math.random() - 0.5)
                * 5,

            vy:
                (Math.random() - 0.5)
                * 5,

            life: 1,

            size:
                Math.random()
                * 3 + 1,

            color: color

        });

    }

}


/* =====================================================
   SHOCKWAVE
===================================================== */

function createShockwave(
    x,
    y,
    color
) {

    ripples.push({

        x: x,

        y: y,

        radius: 5,

        maxRadius:
            100 +
            Math.random()
            * 150,

        life: 1,

        color: color

    });

}


/* =====================================================
   UPDATE PARTICLES
===================================================== */

function updateParticles() {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            0.04;

        p.life -=
            0.018;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();


        ctx.globalAlpha =
            p.life;


        ctx.fillStyle =
            p.color;


        ctx.shadowBlur =
            15;


        ctx.shadowColor =
            p.color;


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();

    }

}


/* =====================================================
   UPDATE SHOCKWAVES
===================================================== */

function updateShockwaves() {

    for (
        let i =
            ripples.length - 1;
        i >= 0;
        i--
    ) {

        const r =
            ripples[i];


        r.radius +=
            (
                r.maxRadius -
                r.radius
            ) * 0.08;


        r.life -=
            0.025;


        if (
            r.life <= 0
        ) {

            ripples.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();


        ctx.globalAlpha =
            r.life;


        ctx.strokeStyle =
            r.color;


        ctx.shadowBlur =
            25;


        ctx.shadowColor =
            r.color;


        ctx.lineWidth =
            4;


        ctx.beginPath();


        ctx.arc(
            r.x,
            r.y,
            r.radius,
            0,
            Math.PI * 2
        );


        ctx.stroke();


        ctx.restore();

    }

}


/* =====================================================
   TRAILS
===================================================== */

function drawTrails() {

    if (
        !trailsEnabled ||
        currentHands.length === 0
    ) {
        return;
    }


    currentHands.forEach(
        hand => {

            FINGER_TIPS.forEach(
                (tip,index) => {

                    const p =
                        mapPoint(
                            hand[tip]
                        );


                    trailPoints.push({

                        x: p.x,

                        y: p.y,

                        life: 1,

                        color:
                            themes[
                                currentTheme
                            ](
                                time,
                                index,
                                5
                            )

                    });

                }
            );

        }
    );


    if (
        trailPoints.length >
        350
    ) {

        trailPoints.splice(
            0,
            trailPoints.length - 350
        );

    }


    for (
        let i =
            trailPoints.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            trailPoints[i];


        p.life -=
            0.025;


        if (
            p.life <= 0
        ) {

            trailPoints.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();


        ctx.globalAlpha =
            p.life * 0.5;


        ctx.fillStyle =
            p.color;


        ctx.shadowBlur =
            12;


        ctx.shadowColor =
            p.color;


        ctx.beginPath();


        ctx.arc(
            p.x,
            p.y,
            2.5,
            0,
            Math.PI * 2
        );


        ctx.fill();


        ctx.restore();

    }

}


/* =====================================================
   DRAW HANDS
===================================================== */

function drawHands() {

    if (
        currentHands.length === 0
    ) {
        return;
    }


    currentHands.forEach(
        (hand,handIndex) => {

            const color =
                themes[currentTheme](
                    time,
                    handIndex,
                    2
                );


            /* SKELETON */

            ctx.save();


            ctx.shadowBlur =
                15;


            ctx.shadowColor =
                color;


            drawConnectors(

                ctx,

                hand,

                HAND_CONNECTIONS,

                {

                    color:
                        color,

                    lineWidth:
                        3

                }

            );


            ctx.restore();


            /* LANDMARKS */

            FINGER_TIPS.forEach(
                (tip,index) => {

                    const point =
                        mapPoint(
                            hand[tip]
                        );


                    const tipColor =
                        themes[currentTheme](
                            time,
                            index,
                            5
                        );


                    ctx.save();


                    ctx.shadowBlur =
                        25;


                    ctx.shadowColor =
                        tipColor;


                    ctx.fillStyle =
                        "#ffffff";


                    ctx.beginPath();


                    ctx.arc(
                        point.x,
                        point.y,
                        5,
                        0,
                        Math.PI * 2
                    );


                    ctx.fill();


                    ctx.restore();


                    if (
                        Math.random() >
                        0.72
                    ) {

                        createParticles(

                            point.x,

                            point.y,

                            tipColor,

                            1

                        );

                    }

                }

            );

        }
    );


    /* =================================================
       CONNECT TWO HANDS
    ================================================= */

    if (
        currentHands.length >= 2
    ) {

        const h1 =
            currentHands[0];

        const h2 =
            currentHands[1];


        FINGER_TIPS.forEach(
            (tip,index) => {

                const p1 =
                    mapPoint(
                        h1[tip]
                    );

                const p2 =
                    mapPoint(
                        h2[tip]
                    );


                const color =
                    themes[currentTheme](
                        time,
                        index,
                        5
                    );


                ctx.save();


                ctx.strokeStyle =
                    color;


                ctx.lineWidth =
                    2.5;


                ctx.shadowBlur =
                    18;


                ctx.shadowColor =
                    color;


                ctx.beginPath();


                ctx.moveTo(
                    p1.x,
                    p1.y
                );


                ctx.lineTo(
                    p2.x,
                    p2.y
                );


                ctx.stroke();


                ctx.restore();


                /* Lightning */

                if (
                    Math.random() >
                    0.72
                ) {

                    const dx =
                        p2.x - p1.x;

                    const dy =
                        p2.y - p1.y;


                    const midX =
                        (p1.x+p2.x)/2
                        +
                        (Math.random()-0.5)
                        * 30;

                    const midY =
                        (p1.y+p2.y)/2
                        +
                        (Math.random()-0.5)
                        * 30;


                    ctx.save();


                    ctx.strokeStyle =
                        "#ffffff";


                    ctx.shadowBlur =
                        20;


                    ctx.shadowColor =
                        color;


                    ctx.lineWidth =
                        2;


                    ctx.beginPath();


                    ctx.moveTo(
                        p1.x,
                        p1.y
                    );


                    ctx.lineTo(
                        midX,
                        midY
                    );


                    ctx.lineTo(
                        p2.x,
                        p2.y
                    );


                    ctx.stroke();


                    ctx.restore();

                }

            }
        );

    }

}


/* =====================================================
   GESTURES
===================================================== */

function detectGestures() {

    if (
        currentHands.length === 0
    ) {

        gestureDisplay.innerText =
            "None";

        spreadDisplay.innerText =
            "0%";

        energy =
            Math.max(
                10,
                energy - 0.1
            );

        return;

    }


    let pinch =
        false;


    let peace =
        false;


    currentHands.forEach(
        (hand,index) => {

            const thumb =
                hand[4];

            const indexFinger =
                hand[8];


            const pinchDistance =
                distance(
                    thumb,
                    indexFinger
                );


            const isPinching =
                pinchDistance <
                0.055;


            if (
                isPinching
            ) {

                pinch =
                    true;

            }


            if (
                isPinching &&
                !previousPinch[index]
            ) {

                const x =
                    (
                        thumb.x +
                        indexFinger.x
                    ) / 2 * width;


                const y =
                    (
                        thumb.y +
                        indexFinger.y
                    ) / 2 * height;


                createShockwave(

                    x,

                    y,

                    themes[currentTheme](
                        time,
                        index,
                        5
                    )

                );


                createParticles(

                    x,

                    y,

                    themes[currentTheme](
                        time,
                        index,
                        5
                    ),

                    20

                );


                energy =
                    Math.min(
                        100,
                        energy + 8
                    );

            }


            previousPinch[index] =
                isPinching;


            /* PEACE DETECTION */

            const indexOpen =
                distance(
                    hand[8],
                    hand[0]
                ) > 0.18;


            const middleOpen =
                distance(
                    hand[12],
                    hand[0]
                ) > 0.18;


            const ringClosed =
                distance(
                    hand[16],
                    hand[0]
                ) < 0.15;


            const pinkyClosed =
                distance(
                    hand[20],
                    hand[0]
                ) < 0.15;


            if (
                indexOpen &&
                middleOpen &&
                ringClosed &&
                pinkyClosed
            ) {

                peace =
                    true;

            }

        }
    );


    if (pinch) {

        gestureDisplay.innerText =
            "PINCH 🤏";

    }

    else if (peace) {

        gestureDisplay.innerText =
            "PEACE ✌️";

    }

    else {

        gestureDisplay.innerText =
            "OPEN HAND ✋";

    }


    /* SPREAD */

    const hand =
        currentHands[0];


    const spread =
        distance(
            hand[8],
            hand[20]
        );


    const spreadPercent =
        Math.min(
            100,
            Math.round(
                spread * 300
            )
        );


    spreadDisplay.innerText =
        spreadPercent + "%";


    /* ENERGY */

    energy =
        Math.min(
            100,
            energy +
            spreadPercent * 0.002
        );

}


/* =====================================================
   UPDATE ENERGY UI
===================================================== */

function updateEnergy() {

    energyFill.style.width =
        Math.round(energy) + "%";

    energyText.innerText =
        Math.round(energy) + "%";

}


/* =====================================================
   MEDIAPIPE RESULTS
===================================================== */

function onHandsResults(
    results
) {

    currentHands =
        results.multiHandLandmarks || [];


    handsCount.innerText =
        currentHands.length;


    if (
        currentHands.length > 0
    ) {

        statusDisplay.innerText =
            "Hand detected • Move your hand ✋";

    }

    else {

        statusDisplay.innerText =
            "Camera active • Show your hand";

    }

}


/* =====================================================
   START CAMERA
===================================================== */

async function startExperience() {

    startBtn.disabled =
        true;

    startBtn.innerText =
        "STARTING...";


    statusDisplay.innerText =
        "Requesting camera permission...";


    try {

        /* =============================================
           CAMERA PERMISSION
        ============================================= */

        cameraStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode:
                        "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        /* =============================================
           CONNECT STREAM
        ============================================= */

        video.srcObject =
            cameraStream;


        video.muted =
            true;


        video.playsInline =
            true;


        video.style.display =
            "block";


        video.style.visibility =
            "visible";


        video.style.opacity =
            "1";


        /* =============================================
           WAIT VIDEO
        ============================================= */

        await new Promise(
            resolve => {

                if (
                    video.readyState >= 2
                ) {

                    resolve();

                }

                else {

                    video.onloadedmetadata =
                        () => resolve();

                }

            }
        );


        await video.play();


        console.log(
            "Camera resolution:",
            video.videoWidth,
            "x",
            video.videoHeight
        );


        statusDisplay.innerText =
            "Camera active • Loading hand tracking...";


        /* =============================================
           MEDIAPIPE
        ============================================= */

        initMediaPipe();


        /* =============================================
           HIDE START SCREEN
        ============================================= */

        setTimeout(
            () => {

                startOverlay.classList.add(
                    "hidden"
                );

            },
            300
        );


        /* =============================================
           RENDER
        ============================================= */

        requestAnimationFrame(
            renderLoop
        );

    }

    catch(error) {

        console.error(
            "Camera error:",
            error
        );


        statusDisplay.innerText =
            "Camera could not start";


        startBtn.disabled =
            false;


        startBtn.innerText =
            "TRY AGAIN";


        const errorBox =
            document.getElementById(
                "errorBox"
            );


        const errorText =
            document.getElementById(
                "errorText"
            );


        errorText.innerText =
            error.message ||
            "Please allow camera access and try again.";


        errorBox.style.display =
            "block";

    }

}


/* =====================================================
   INITIALIZE MEDIAPIPE
===================================================== */

function initMediaPipe() {

    mediaPipeHands =
        new Hands({

            locateFile:
                function(file) {

                    return (
                        "https://cdn.jsdelivr.net/" +
                        "npm/@mediapipe/hands/" +
                        file
                    );

                }

        });


    mediaPipeHands.setOptions({

        maxNumHands:
            2,

        modelComplexity:
            1,

        minDetectionConfidence:
            0.6,

        minTrackingConfidence:
            0.6

    });


    mediaPipeHands.onResults(
        onHandsResults
    );


    camera =
        new Camera(
            video,
            {

                onFrame:
                    async function() {

                        try {

                            await mediaPipeHands
                                .send({
                                    image:
                                        video
                                });

                        }

                        catch(error) {

                            console.error(
                                error
                            );

                        }

                    },

                width:
                    1280,

                height:
                    720,

                facingMode:
                    "user"

            }
        );


    camera.start();

}


/* =====================================================
   RENDER LOOP
===================================================== */

function renderLoop(
    timestamp
) {

    const delta =
        (
            timestamp -
            lastTime
        ) / 1000;


    lastTime =
        timestamp;


    time +=
        delta;


    /* FPS */

    frames++;


    if (
        timestamp -
        fpsTime >=
        1000
    ) {

        fpsDisplay.innerText =
            frames;

        frames =
            0;

        fpsTime =
            timestamp;

    }


    /* =============================================
       BACKGROUND
    ============================================= */

    drawBackground();


    /* =============================================
       IMPORTANT

       Clear effect canvas instead of painting black.
       This is what keeps the camera visible.
    ============================================= */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* =============================================
       EFFECTS
    ============================================= */

    drawTrails();

    drawPortal();

    updateParticles();

    updateShockwaves();

    drawHands();

    detectGestures();

    updateEnergy();


    /* =============================================
       NEXT FRAME
    ============================================= */

    requestAnimationFrame(
        renderLoop
    );

}

captureBtn.addEventListener(
    "click",
    () => {

        const capture =
            document.createElement(
                "canvas"
            );


        capture.width =
            video.videoWidth ||
            width;


        capture.height =
            video.videoHeight ||
            height;


        const c =
            capture.getContext(
                "2d"
            );


        /*
           Camera
        */

        c.save();

        c.translate(
            capture.width,
            0
        );

        c.scale(
            -1,
            1
        );


        c.drawImage(

            video,

            0,
            0,

            capture.width,
            capture.height

        );


        c.restore();


        /*
           AR effects
        */

        c.drawImage(

            effectCanvas,

            0,
            0,

            capture.width,
            capture.height

        );


        /*
           Download
        */

        const link =
            document.createElement(
                "a"
            );


        link.download =
            "neon-aura-capture.png";


        link.href =
            capture.toDataURL(
                "image/png"
            );


        link.click();

    }
);
