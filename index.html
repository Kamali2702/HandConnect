<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Aura AR - Hand Tracking</title>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* CAMERA */
        #video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
            filter: brightness(0.65) contrast(1.1);
        }

        /* EFFECT CANVAS */
        #canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
            z-index: 2;
            pointer-events: none;
        }

        /* START SCREEN */
        #startScreen {
            position: fixed;
            inset: 0;
            z-index: 20;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at center,
                    #15152d,
                    #020207 70%
                );
        }

        #startScreen h1 {
            font-size: clamp(35px, 6vw, 70px);
            font-weight: 300;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }

        #startScreen p {
            color: #999;
            margin-bottom: 35px;
            text-align: center;
            padding: 0 20px;
        }

        #startBtn {
            border: none;
            border-radius: 40px;

            padding: 18px 45px;

            color: white;
            font-size: 18px;
            font-weight: bold;

            letter-spacing: 2px;

            cursor: pointer;

            background:
                linear-gradient(
                    45deg,
                    #ff00cc,
                    #3333ff
                );

            box-shadow:
                0 0 20px #ff00cc,
                0 0 40px rgba(51, 51, 255, 0.5);

            transition: 0.3s;
        }

        #startBtn:hover {
            transform: scale(1.06);
        }

        #startBtn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;

            z-index: 10;

            display: none;

            flex-direction: column;
            gap: 12px;
        }

        .panel {
            min-width: 220px;

            padding: 16px 20px;

            border-radius: 14px;

            background: rgba(10, 10, 25, 0.55);

            border: 1px solid rgba(255,255,255,0.18);

            backdrop-filter: blur(15px);

            box-shadow:
                0 10px 40px rgba(0,0,0,0.4);
        }

        .row {
            display: flex;
            justify-content: space-between;

            margin-bottom: 8px;

            color: #ddd;
        }

        .row:last-child {
            margin-bottom: 0;
        }

        .value {
            color: #00ffcc;
            font-weight: bold;
        }

        /* THEMES */
        #themes {
            position: fixed;

            bottom: 25px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            display: none;

            gap: 5px;

            padding: 8px;

            border-radius: 40px;

            background: rgba(10,10,25,0.6);

            border: 1px solid rgba(255,255,255,0.2);

            backdrop-filter: blur(15px);
        }

        .theme {
            border: none;
            background: transparent;

            color: white;

            padding: 10px 15px;

            border-radius: 25px;

            cursor: pointer;

            font-weight: bold;
        }

        .theme.active {
            background: rgba(255,255,255,0.18);
            box-shadow: 0 0 15px rgba(255,255,255,0.15);
        }

        /* ERROR */
        #error {
            position: fixed;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 100;

            display: none;

            max-width: 90%;

            padding: 14px 20px;

            border-radius: 10px;

            background: rgba(180,0,40,0.9);

            color: white;

            text-align: center;
        }
    </style>
</head>

<body>

    <!-- CAMERA -->
    <video
        id="video"
        autoplay
        playsinline
        muted>
    </video>

    <!-- EFFECTS -->
    <canvas id="canvas"></canvas>

    <!-- START SCREEN -->
    <div id="startScreen">

        <h1>NEON AURA AR</h1>

        <p>
            Allow camera access and enter the hand tracking experience
        </p>

        <button id="startBtn">
            ENTER EXPERIENCE
        </button>

    </div>

    <!-- ERROR -->
    <div id="error"></div>

    <!-- HUD -->
    <div id="hud">

        <div class="panel">

            <div class="row">
                <span>Hands Detected</span>
                <span class="value" id="hands">
                    0
                </span>
            </div>

            <div class="row">
                <span>FPS</span>
                <span class="value" id="fps">
                    0
                </span>
            </div>

        </div>

        <div class="panel">

            <div class="row">
                <span>Gesture</span>
                <span class="value" id="gesture">
                    None
                </span>
            </div>

            <div class="row">
                <span>Spread</span>
                <span class="value" id="spread">
                    0%
                </span>
            </div>

        </div>

    </div>

    <!-- THEMES -->
    <div id="themes">

        <button class="theme active" data-theme="rainbow">
            Rainbow
        </button>

        <button class="theme" data-theme="cyber">
            Cyberpunk
        </button>

        <button class="theme" data-theme="lava">
            Lava
        </button>

        <button class="theme" data-theme="ocean">
            Ocean
        </button>

        <button class="theme" data-theme="galaxy">
            Galaxy
        </button>

    </div>


<script>

/* =====================================
   ELEMENTS
===================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startBtn =
    document.getElementById("startBtn");

const hud =
    document.getElementById("hud");

const themes =
    document.getElementById("themes");

const errorBox =
    document.getElementById("error");

const handsUI =
    document.getElementById("hands");

const fpsUI =
    document.getElementById("fps");

const gestureUI =
    document.getElementById("gesture");

const spreadUI =
    document.getElementById("spread");


/* =====================================
   VARIABLES
===================================== */

let width =
    window.innerWidth;

let height =
    window.innerHeight;

let detectedHands = [];

let particles = [];

let ripples = [];

let animationTime = 0;

let lastFrame = performance.now();

let frameCount = 0;

let fpsTimer = performance.now();

let currentTheme = "rainbow";

const fingertips = [
    4,
    8,
    12,
    16,
    20
];

let previousPinch = [
    false,
    false
];


/* =====================================
   THEMES
===================================== */

const colors = {

    rainbow: function(time, index) {

        const hue =
            (time * 100 + index * 70) % 360;

        return `hsl(${hue},100%,60%)`;
    },

    cyber: function(time, index) {

        return index % 2 === 0
            ? "#ff0055"
            : "#00ffff";
    },

    lava: function(time, index) {

        return `hsl(
            ${10 + index * 8},
            100%,
            60%
        )`;
    },

    ocean: function(time, index) {

        return `hsl(
            ${180 + index * 15},
            100%,
            60%
        )`;
    },

    galaxy: function(time, index) {

        return `hsl(
            ${260 + index * 20},
            100%,
            70%
        )`;
    }

};


/* =====================================
   RESIZE
===================================== */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width;

    canvas.height =
        height;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================
   THEME BUTTONS
===================================== */

document
.querySelectorAll(".theme")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".theme")
            .forEach(b =>
                b.classList.remove("active")
            );

            button.classList.add("active");

            currentTheme =
                button.dataset.theme;
        }
    );

});


/* =====================================
   START EXPERIENCE
===================================== */

startBtn.addEventListener(
    "click",
    async () => {

        startBtn.disabled = true;

        startBtn.textContent =
            "STARTING...";

        try {

            /*
             * CAMERA PERMISSION
             */

            const stream =
                await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        facingMode: "user",
                        width: {
                            ideal: 1280
                        },
                        height: {
                            ideal: 720
                        }
                    },

                    audio: false
                });


            /*
             * SHOW CAMERA
             */

            video.srcObject =
                stream;

            await video.play();


            /*
             * HIDE START SCREEN
             */

            startScreen.style.display =
                "none";

            hud.style.display =
                "flex";

            themes.style.display =
                "flex";


            /*
             * START MEDIAPIPE
             */

            await startHandTracking();


            /*
             * START ANIMATION
             */

            requestAnimationFrame(
                animationLoop
            );

        }

        catch(error) {

            console.error(error);

            showError(
                "Camera access failed. Please allow camera permission and reload the page."
            );

            startBtn.disabled =
                false;

            startBtn.textContent =
                "ENTER EXPERIENCE";
        }

    }
);


/* =====================================
   ERROR
===================================== */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";
}


/* =====================================
   MEDIAPIPE
===================================== */

async function startHandTracking() {

    if (
        typeof Hands ===
        "undefined"
    ) {

        throw new Error(
            "MediaPipe Hands failed to load."
        );
    }


    const hands =
        new Hands({

            locateFile:
                function(file) {

                    return (
                        "https://cdn.jsdelivr.net/npm/@mediapipe/hands/"
                        + file
                    );
                }

        });


    hands.setOptions({

        maxNumHands: 2,

        modelComplexity: 1,

        minDetectionConfidence: 0.6,

        minTrackingConfidence: 0.6

    });


    hands.onResults(
        handleResults
    );


    /*
     * PROCESS CAMERA FRAMES
     */

    async function processFrame() {

        if (
            video.readyState >= 2
        ) {

            try {

                await hands.send({
                    image: video
                });

            }

            catch(error) {

                console.error(
                    "MediaPipe error:",
                    error
                );
            }
        }

        requestAnimationFrame(
            processFrame
        );
    }


    processFrame();
}


/* =====================================
   MEDIAPIPE RESULTS
===================================== */

function handleResults(results) {

    detectedHands =
        results.multiHandLandmarks || [];


    handsUI.textContent =
        detectedHands.length;


    /*
     * GESTURE
     */

    if (
        detectedHands.length > 0
    ) {

        detectGesture(
            detectedHands[0]
        );

    }
    else {

        gestureUI.textContent =
            "None";

        spreadUI.textContent =
            "0%";
    }

}


/* =====================================
   DISTANCE
===================================== */

function distance(a,b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}


/* =====================================
   GESTURE DETECTION
===================================== */

function detectGesture(hand) {

    const thumb =
        hand[4];

    const index =
        hand[8];

    const pinchDistance =
        distance(
            thumb,
            index
        );


    /*
     * PINCH
     */

    if (
        pinchDistance < 0.06
    ) {

        gestureUI.textContent =
            "PINCH";

        const x =
            ((thumb.x + index.x) / 2)
            * width;

        const y =
            ((thumb.y + index.y) / 2)
            * height;


        if (
            !previousPinch[0]
        ) {

            createRipple(
                x,
                y
            );
        }

        previousPinch[0] =
            true;

    }

    else {

        previousPinch[0] =
            false;


        /*
         * OPEN HAND / FIST
         */

        const spread =
            distance(
                hand[8],
                hand[20]
            );

        const percentage =
            Math.min(
                100,
                Math.round(
                    spread * 300
                )
            );


        spreadUI.textContent =
            percentage + "%";


        gestureUI.textContent =
            percentage > 50
            ? "OPEN HAND"
            : "FIST";
    }

}


/* =====================================
   RIPPLE
===================================== */

function createRipple(
    x,
    y
) {

    ripples.push({

        x: x,

        y: y,

        radius: 10,

        life: 1

    });

}


/* =====================================
   PARTICLES
===================================== */

function createParticle(
    x,
    y,
    color
) {

    particles.push({

        x: x,

        y: y,

        vx:
            (Math.random() - 0.5)
            * 5,

        vy:
            (Math.random() - 0.5)
            * 5,

        life: 1,

        color: color,

        size:
            Math.random() * 3 + 1
    });

}


/* =====================================
   DRAW HAND
===================================== */

function drawHand(
    hand,
    handIndex
) {

    const color =
        colors[currentTheme](
            animationTime,
            handIndex
        );


    /*
     * CONNECTIONS
     */

    const connections = [

        [0,1],
        [1,2],
        [2,3],
        [3,4],

        [0,5],
        [5,6],
        [6,7],
        [7,8],

        [5,9],
        [9,10],
        [10,11],
        [11,12],

        [9,13],
        [13,14],
        [14,15],
        [15,16],

        [13,17],
        [17,18],
        [18,19],
        [19,20],

        [0,17]

    ];


    /*
     * NEON LINES
     */

    ctx.shadowBlur =
        20;

    ctx.shadowColor =
        color;

    ctx.strokeStyle =
        color;

    ctx.lineWidth =
        3;


    connections.forEach(
        pair => {

            const a =
                hand[pair[0]];

            const b =
                hand[pair[1]];


            const ax =
                a.x * width;

            const ay =
                a.y * height;

            const bx =
                b.x * width;

            const by =
                b.y * height;


            ctx.beginPath();

            ctx.moveTo(
                ax,
                ay
            );

            ctx.lineTo(
                bx,
                by
            );

            ctx.stroke();

        }
    );


    /*
     * LANDMARKS
     */

    fingertips.forEach(
        (index, i) => {

            const point =
                hand[index];

            const x =
                point.x * width;

            const y =
                point.y * height;

            const tipColor =
                colors[currentTheme](
                    animationTime,
                    i
                );


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                7,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#ffffff";

            ctx.shadowBlur =
                30;

            ctx.shadowColor =
                tipColor;

            ctx.fill();


            /*
             * PARTICLES
             */

            if (
                Math.random() > 0.5
            ) {

                createParticle(
                    x,
                    y,
                    tipColor
                );

            }

        }
    );


    ctx.shadowBlur =
        0;

}


/* =====================================
   TWO HAND CONNECTION
===================================== */

function drawTwoHands() {

    if (
        detectedHands.length < 2
    ) {
        return;
    }


    const hand1 =
        detectedHands[0];

    const hand2 =
        detectedHands[1];


    fingertips.forEach(
        (tip, index) => {

            const p1 =
                hand1[tip];

            const p2 =
                hand2[tip];


            const x1 =
                p1.x * width;

            const y1 =
                p1.y * height;

            const x2 =
                p2.x * width;

            const y2 =
                p2.y * height;


            const color =
                colors[currentTheme](
                    animationTime,
                    index
                );


            /*
             * CONNECTION
             */

            ctx.beginPath();

            ctx.moveTo(
                x1,
                y1
            );

            ctx.lineTo(
                x2,
                y2
            );

            ctx.strokeStyle =
                color;

            ctx.lineWidth =
                4;

            ctx.shadowBlur =
                25;

            ctx.shadowColor =
                color;

            ctx.stroke();


            /*
             * LIGHTNING
             */

            if (
                distance(
                    p1,
                    p2
                ) < 0.25
            ) {

                const midX =
                    (x1 + x2) / 2
                    +
                    (Math.random()-0.5)
                    * 40;

                const midY =
                    (y1 + y2) / 2
                    +
                    (Math.random()-0.5)
                    * 40;


                ctx.beginPath();

                ctx.moveTo(
                    x1,
                    y1
                );

                ctx.lineTo(
                    midX,
                    midY
                );

                ctx.lineTo(
                    x2,
                    y2
                );

                ctx.strokeStyle =
                    "#ffffff";

                ctx.lineWidth =
                    2;

                ctx.stroke();

            }

        }
    );


    ctx.shadowBlur =
        0;

}


/* =====================================
   PARTICLE UPDATE
===================================== */

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.life -=
            0.025;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;
        }


        ctx.globalAlpha =
            p.life;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            p.color;

        ctx.fill();

    }

    ctx.globalAlpha =
        1;

}


/* =====================================
   RIPPLE UPDATE
===================================== */

function updateRipples() {

    for (
        let i = ripples.length - 1;
        i >= 0;
        i--
    ) {

        const ripple =
            ripples[i];


        ripple.radius +=
            8;

        ripple.life -=
            0.025;


        if (
            ripple.life <= 0
        ) {

            ripples.splice(
                i,
                1
            );

            continue;
        }


        ctx.beginPath();

        ctx.arc(
            ripple.x,
            ripple.y,
            ripple.radius,
            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            colors[currentTheme](
                animationTime,
                1
            );

        ctx.lineWidth =
            5 *
            ripple.life;

        ctx.globalAlpha =
            ripple.life;

        ctx.shadowBlur =
            25;

        ctx.shadowColor =
            ctx.strokeStyle;

        ctx.stroke();

        ctx.shadowBlur =
            0;

    }

    ctx.globalAlpha =
        1;

}


/* =====================================
   ANIMATION
===================================== */

function animationLoop(timestamp) {

    animationTime +=
        0.016;


    /*
     * FPS
     */

    frameCount++;


    if (
        timestamp - fpsTimer
        >= 1000
    ) {

        fpsUI.textContent =
            frameCount;

        frameCount =
            0;

        fpsTimer =
            timestamp;

    }


    /*
     * CLEAR
     */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * DRAW HANDS
     */

    detectedHands.forEach(
        drawHand
    );


    /*
     * TWO HAND EFFECT
     */

    drawTwoHands();


    /*
     * PARTICLES
     */

    updateParticles();


    /*
     * RIPPLES
     */

    updateRipples();


    requestAnimationFrame(
        animationLoop
    );

}


/* =====================================
   CAMERA SUPPORT CHECK
===================================== */

if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
) {

    showError(
        "Your browser does not support camera access. Please use Chrome or Edge."
    );

}

</script>

</body>
</html>
