<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Aura AR - Advanced Hand Tracking</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>
:root {
    --bg: #03030b;
    --accent: #00ffcc;
    --glass: rgba(10, 15, 30, 0.55);
    --border: rgba(255,255,255,0.18);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: white;
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}

/* CAMERA */

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    z-index: 0;

    filter:
        brightness(0.58)
        contrast(1.12)
        saturate(1.1);
}

/* CANVAS */

#backgroundCanvas,
#effectCanvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    transform: scaleX(-1);

    pointer-events: none;
}

#backgroundCanvas {
    z-index: 1;
}

#effectCanvas {
    z-index: 2;
}

/* START SCREEN */

#startScreen {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: flex;
    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            #15153c 0%,
            #070711 45%,
            #010105 100%
        );

    backdrop-filter: blur(12px);

    transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
}

#startScreen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

#startScreen h1 {
    font-size: clamp(35px, 7vw, 80px);

    font-weight: 300;

    letter-spacing: 10px;

    margin-bottom: 20px;

    text-shadow:
        0 0 15px #00ffff,
        0 0 35px #ff00cc;
}

#startScreen p {
    color: #aaa;

    max-width: 650px;

    line-height: 1.6;

    padding: 0 20px;

    margin-bottom: 35px;
}

#startButton {
    border: none;

    padding: 16px 42px;

    border-radius: 40px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    letter-spacing: 2px;

    cursor: pointer;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #3333ff
        );

    box-shadow:
        0 0 20px #ff00cc88,
        0 0 50px #3333ff55;

    transition: transform 0.2s ease;
}

#startButton:hover {
    transform: scale(1.06);
}

/* HUD */

#hud {
    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 20;

    display: none;

    flex-direction: column;

    gap: 12px;
}

.panel {
    min-width: 235px;

    padding: 15px 18px;

    border-radius: 15px;

    background: var(--glass);

    border: 1px solid var(--border);

    backdrop-filter: blur(16px);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.5);
}

.row {
    display: flex;

    justify-content: space-between;

    gap: 25px;

    margin: 7px 0;

    color: #ddd;

    font-size: 14px;
}

.value {
    color: var(--accent);

    font-weight: bold;
}

/* POWER */

.powerTitle {
    display: flex;

    justify-content: space-between;

    margin-top: 12px;

    margin-bottom: 5px;

    font-size: 13px;
}

.powerBackground {
    width: 100%;

    height: 7px;

    overflow: hidden;

    border-radius: 10px;

    background: rgba(255,255,255,0.12);
}

#powerBar {
    width: 0%;

    height: 100%;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #00ffcc,
            #00aaff,
            #ff00cc,
            white
        );

    box-shadow:
        0 0 12px var(--accent);

    transition: width 0.12s ease;
}

/* RIGHT CONTROLS */

#controls {
    position: fixed;

    top: 20px;
    right: 20px;

    z-index: 20;

    display: none;

    flex-direction: column;

    gap: 8px;
}

.controlButton {
    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 9px 14px;

    color: white;

    background: var(--glass);

    backdrop-filter: blur(12px);

    cursor: pointer;

    transition: 0.2s;
}

.controlButton:hover {
    background: rgba(255,255,255,0.18);

    transform: translateY(-2px);
}

/* THEMES */

#themes {
    position: fixed;

    bottom: 20px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    display: none;

    gap: 6px;

    max-width: 95vw;

    overflow-x: auto;

    padding: 7px;

    border: 1px solid var(--border);

    border-radius: 30px;

    background: var(--glass);

    backdrop-filter: blur(15px);
}

.themeButton {
    white-space: nowrap;

    border: 1px solid transparent;

    border-radius: 20px;

    padding: 8px 13px;

    color: white;

    background: transparent;

    cursor: pointer;

    transition: 0.2s;
}

.themeButton:hover {
    background: rgba(255,255,255,0.12);
}

.themeButton.active {
    background: rgba(255,255,255,0.18);

    border-color: rgba(255,255,255,0.3);

    box-shadow:
        0 0 15px rgba(255,255,255,0.15);
}

/* STATUS */

#status {
    position: fixed;

    bottom: 82px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    display: none;

    padding: 9px 18px;

    border-radius: 25px;

    background: rgba(0,0,0,0.55);

    backdrop-filter: blur(10px);

    color: #ddd;

    font-size: 13px;

    white-space: nowrap;
}

/* ERROR */

#errorBox {
    position: fixed;

    top: 20px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 200;

    display: none;

    max-width: 90%;

    padding: 13px 18px;

    border-radius: 10px;

    background: rgba(180,0,50,0.92);

    color: white;

    text-align: center;
}

/* MOBILE */

@media (max-width: 700px) {

    #hud {
        top: 10px;
        left: 10px;
    }

    .panel {
        min-width: 190px;

        padding: 10px 12px;
    }

    .row {
        font-size: 12px;
    }

    #controls {
        top: 10px;
        right: 10px;
    }

    .controlButton {
        padding: 7px 10px;

        font-size: 11px;
    }

    #themes {
        bottom: 10px;
    }

    .themeButton {
        padding: 7px 9px;

        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- CAMERA -->
<video
    id="video"
    autoplay
    playsinline
    muted>
</video>

<!-- CANVASES -->
<canvas id="backgroundCanvas"></canvas>
<canvas id="effectCanvas"></canvas>


<!-- START -->
<div id="startScreen">

    <h1>NEON AURA AR</h1>

    <p>
        Advanced hand tracking experience with
        neon particles, energy portals, fingertip trails,
        lightning and interactive gestures.
    </p>

    <button id="startButton">
        ENTER EXPERIENCE
    </button>

</div>


<!-- ERROR -->
<div id="errorBox"></div>


<!-- HUD -->
<div id="hud">

    <div class="panel">

        <div class="row">
            <span>Hands</span>
            <span
                class="value"
                id="handsValue">
                0
            </span>
        </div>

        <div class="row">
            <span>FPS</span>
            <span
                class="value"
                id="fpsValue">
                0
            </span>
        </div>

        <div class="row">
            <span>Gesture</span>
            <span
                class="value"
                id="gestureValue">
                None
            </span>
        </div>

        <div class="row">
            <span>Spread</span>
            <span
                class="value"
                id="spreadValue">
                0%
            </span>
        </div>

        <div class="powerTitle">
            <span>ENERGY POWER</span>

            <span
                class="value"
                id="powerValue">
                0%
            </span>
        </div>

        <div class="powerBackground">
            <div id="powerBar"></div>
        </div>

    </div>

</div>


<!-- CONTROLS -->
<div id="controls">

    <button
        class="controlButton"
        id="captureButton">
        📸 Capture
    </button>

    <button
        class="controlButton"
        id="trailButton">
        ✨ Trails: ON
    </button>

    <button
        class="controlButton"
        id="portalButton">
        🌀 Portal: ON
    </button>

</div>


<!-- STATUS -->
<div id="status">
    Show your hand 🖐️
</div>


<!-- THEMES -->
<div id="themes">

    <button
        class="themeButton active"
        data-theme="Rainbow">
        🌈 Rainbow
    </button>

    <button
        class="themeButton"
        data-theme="Cyberpunk">
        💗 Cyberpunk
    </button>

    <button
        class="themeButton"
        data-theme="Lava">
        🔥 Lava
    </button>

    <button
        class="themeButton"
        data-theme="Ocean">
        🌊 Ocean
    </button>

    <button
        class="themeButton"
        data-theme="Galaxy">
        🌌 Galaxy
    </button>

    <button
        class="themeButton"
        data-theme="Aurora">
        🌈 Aurora
    </button>

    <button
        class="themeButton"
        data-theme="Ice">
        ❄️ Ice
    </button>

    <button
        class="themeButton"
        data-theme="Inferno">
        🔥 Inferno
    </button>

    <button
        class="themeButton"
        data-theme="Mystic">
        🔮 Mystic
    </button>

    <button
        class="themeButton"
        data-theme="Toxic">
        ☢️ Toxic
    </button>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const backgroundCanvas =
    document.getElementById("backgroundCanvas");

const effectCanvas =
    document.getElementById("effectCanvas");

const bg =
    backgroundCanvas.getContext("2d");

const ctx =
    effectCanvas.getContext("2d");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const hud =
    document.getElementById("hud");

const controls =
    document.getElementById("controls");

const themes =
    document.getElementById("themes");

const status =
    document.getElementById("status");

const errorBox =
    document.getElementById("errorBox");

const handsValue =
    document.getElementById("handsValue");

const fpsValue =
    document.getElementById("fpsValue");

const gestureValue =
    document.getElementById("gestureValue");

const spreadValue =
    document.getElementById("spreadValue");

const powerValue =
    document.getElementById("powerValue");

const powerBar =
    document.getElementById("powerBar");


/* =========================================================
   GLOBAL STATE
========================================================= */

let width =
    window.innerWidth;

let height =
    window.innerHeight;

let currentTheme =
    "Rainbow";

let time = 0;

let lastFrame =
    performance.now();

let fpsFrames = 0;

let fpsTimer =
    performance.now();

let currentHands = [];

let previousHands = [];

let particles = [];

let ripples = [];

let trails = [];

let sparks = [];

let matrixDrops = [];

let trailEnabled = true;

let portalEnabled = true;

let power = 0;

let lastPinch =
    [false, false];

let cameraStream = null;


/* =========================================================
   CONSTANTS
========================================================= */

const FINGER_TIPS =
    [4, 8, 12, 16, 20];

const FINGER_NAMES =
    [
        "Thumb",
        "Index",
        "Middle",
        "Ring",
        "Pinky"
    ];


/* =========================================================
   THEMES
========================================================= */

const themeFunctions = {

    Rainbow: function(t, i, total) {

        return `hsl(
            ${(t * 100 + i * (360 / total)) % 360},
            100%,
            60%
        )`;

    },

    Cyberpunk: function(t, i) {

        return i % 2 === 0
            ? "#ff0066"
            : "#00f5ff";

    },

    Lava: function(t, i) {

        return `hsl(
            ${10 + i * 8},
            100%,
            ${55 + Math.sin(t * 2) * 8}%
        )`;

    },

    Ocean: function(t, i) {

        return `hsl(
            ${180 + i * 18},
            100%,
            62%
        )`;

    },

    Galaxy: function(t, i) {

        return `hsl(
            ${250 + Math.sin(t * 2 + i) * 45},
            100%,
            68%
        )`;

    },

    Aurora: function(t, i) {

        return `hsl(
            ${120 + Math.sin(t + i) * 50},
            100%,
            65%
        )`;

    },

    Ice: function(t, i) {

        return `hsl(
            ${185 + i * 12},
            100%,
            72%
        )`;

    },

    Inferno: function(t, i) {

        return `hsl(
            ${5 + i * 12},
            100%,
            58%
        )`;

    },

    Mystic: function(t, i) {

        return `hsl(
            ${285 + Math.sin(t + i) * 30},
            100%,
            68%
        )`;

    },

    Toxic: function(t, i) {

        return `hsl(
            ${75 + i * 20},
            100%,
            60%
        )`;

    }

};


/* =========================================================
   COLOR
========================================================= */

function getColor(
    index = 0,
    total = 5
) {

    return themeFunctions[currentTheme](
        time,
        index,
        total
    );

}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    backgroundCanvas.width =
        width;

    backgroundCanvas.height =
        height;

    effectCanvas.width =
        width;

    effectCanvas.height =
        height;

    const columns =
        Math.ceil(width / 16);

    matrixDrops =
        Array.from(
            { length: columns },
            () => Math.random() * height / 16
        );

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   ERROR
========================================================= */

function showError(message) {

    errorBox.textContent =
        message;

    errorBox.style.display =
        "block";

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a, b) {

    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );

}


/* =========================================================
   LANDMARK TO CANVAS
========================================================= */

function canvasPoint(point) {

    return {

        x: point.x * width,

        y: point.y * height

    };

}


/* =========================================================
   THEME BUTTONS
========================================================= */

document
.querySelectorAll(".themeButton")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".themeButton")
            .forEach(b =>
                b.classList.remove("active")
            );

            button.classList.add("active");

            currentTheme =
                button.dataset.theme;

            document.documentElement
            .style
            .setProperty(
                "--accent",
                getColor(1, 2)
            );

        }
    );

});


/* =========================================================
   TRAIL BUTTON
========================================================= */

document
.getElementById("trailButton")
.addEventListener(
    "click",
    () => {

        trailEnabled =
            !trailEnabled;

        document
        .getElementById("trailButton")
        .textContent =
            `✨ Trails: ${
                trailEnabled
                ? "ON"
                : "OFF"
            }`;

        if (!trailEnabled) {

            trails = [];

        }

    }
);


/* =========================================================
   PORTAL BUTTON
========================================================= */

document
.getElementById("portalButton")
.addEventListener(
    "click",
    () => {

        portalEnabled =
            !portalEnabled;

        document
        .getElementById("portalButton")
        .textContent =
            `🌀 Portal: ${
                portalEnabled
                ? "ON"
                : "OFF"
            }`;

    }
);


/* =========================================================
   SCREENSHOT
========================================================= */

document
.getElementById("captureButton")
.addEventListener(
    "click",
    captureImage
);


function captureImage() {

    const output =
        document.createElement("canvas");

    output.width =
        width;

    output.height =
        height;

    const outputContext =
        output.getContext("2d");

    /*
       Mirror camera into screenshot
    */

    outputContext.save();

    outputContext.translate(
        width,
        0
    );

    outputContext.scale(
        -1,
        1
    );

    outputContext.drawImage(
        video,
        0,
        0,
        width,
        height
    );

    outputContext.restore();

    /*
       Add effects
    */

    outputContext.drawImage(
        backgroundCanvas,
        0,
        0
    );

    outputContext.drawImage(
        effectCanvas,
        0,
        0
    );

    const link =
        document.createElement("a");

    link.download =
        "neon-aura-ar.png";

    link.href =
        output.toDataURL(
            "image/png"
        );

    link.click();

}


/* =========================================================
   START
========================================================= */

startButton.addEventListener(
    "click",
    startExperience
);


async function startExperience() {

    try {

        startButton.textContent =
            "REQUESTING CAMERA...";

        /*
           GitHub Pages runs on HTTPS,
           so camera access is allowed.
        */

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Camera API unavailable."
            );

        }


        cameraStream =
            await navigator.mediaDevices
            .getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        video.srcObject =
            cameraStream;

        await video.play();


        /*
           Initialize MediaPipe
        */

        await initializeMediaPipe();


        startScreen
        .classList
        .add("hidden");

        hud.style.display =
            "flex";

        controls.style.display =
            "flex";

        themes.style.display =
            "flex";

        status.style.display =
            "block";

        status.textContent =
            "Show your hand 🖐️";


        requestAnimationFrame(
            renderLoop
        );


    } catch (error) {

        console.error(error);

        startButton.textContent =
            "TRY AGAIN";

        showError(
            "Camera could not start. Please allow camera permission and reload the GitHub Pages website."
        );

    }

}


/* =========================================================
   MEDIAPIPE
========================================================= */

async function initializeMediaPipe() {

    if (
        typeof Hands ===
        "undefined"
    ) {

        throw new Error(
            "MediaPipe failed to load."
        );

    }


    const hands =
        new Hands({

            locateFile:
                function(file) {

                    return (
                        "https://cdn.jsdelivr.net/npm/" +
                        "@mediapipe/hands/" +
                        file
                    );

                }

        });


    hands.setOptions({

        maxNumHands: 2,

        modelComplexity: 1,

        minDetectionConfidence: 0.65,

        minTrackingConfidence: 0.65

    });


    hands.onResults(
        processResults
    );


    /*
       Camera loop
    */

    async function sendFrame() {

        if (
            video.readyState >= 2
        ) {

            try {

                await hands.send({
                    image: video
                });

            } catch(error) {

                console.warn(
                    "MediaPipe frame error:",
                    error
                );

            }

        }

        requestAnimationFrame(
            sendFrame
        );

    }

    sendFrame();

}


/* =========================================================
   RESULTS
========================================================= */

function processResults(
    results
) {

    const detected =
        results.multiHandLandmarks ||
        [];


    /*
       Calculate movement
    */

    let movement = 0;


    if (
        previousHands.length > 0 &&
        detected.length > 0
    ) {

        movement =
            distance(
                previousHands[0][8],
                detected[0][8]
            );

    }


    previousHands =
        detected.map(
            hand =>
                hand.map(
                    point => ({
                        x: point.x,
                        y: point.y,
                        z: point.z
                    })
                )
        );


    currentHands =
        detected;


    handsValue.textContent =
        currentHands.length;


    /*
       Power calculation
    */

    const movementPower =
        Math.min(
            1,
            movement * 18
        );


    let proximityPower = 0;


    if (
        currentHands.length >= 2
    ) {

        proximityPower =
            1 -
            Math.min(
                1,
                distance(
                    currentHands[0][8],
                    currentHands[1][8]
                ) * 2
            );

    }


    const targetPower =
        Math.min(
            100,
            currentHands.length * 25 +
            movementPower * 45 +
            proximityPower * 30
        );


    power +=
        (
            targetPower -
            power
        ) * 0.12;


    powerValue.textContent =
        Math.round(power) +
        "%";

    powerBar.style.width =
        power + "%";


    detectGestures();

}


/* =========================================================
   GESTURES
========================================================= */

function detectGestures() {

    if (
        currentHands.length === 0
    ) {

        gestureValue.textContent =
            "None";

        spreadValue.textContent =
            "0%";

        return;

    }


    const hand =
        currentHands[0];


    /*
       PINCH
    */

    const pinchDistance =
        distance(
            hand[4],
            hand[8]
        );


    const pinch =
        pinchDistance < 0.055;


    /*
       SPREAD
    */

    const spread =
        Math.min(
            100,
            Math.round(
                distance(
                    hand[8],
                    hand[20]
                ) * 300
            )
        );


    spreadValue.textContent =
        spread + "%";


    if (pinch) {

        gestureValue.textContent =
            "PINCH ⚡";


        if (!lastPinch[0]) {

            const middle = {

                x:
                    (
                        hand[4].x +
                        hand[8].x
                    ) / 2,

                y:
                    (
                        hand[4].y +
                        hand[8].y
                    ) / 2

            };


            const point =
                canvasPoint(
                    middle
                );


            createBurst(
                point.x,
                point.y,
                35
            );


            createRipple(
                point.x,
                point.y,
                20,
                260
            );

        }


        lastPinch[0] =
            true;


        return;

    }


    lastPinch[0] =
        false;


    /*
       INDEX FINGER
    */

    const indexUp =
        hand[8].y <
        hand[6].y;


    const middleDown =
        hand[12].y >
        hand[10].y;


    /*
       PEACE
    */

    if (
        indexUp &&
        !middleDown
    ) {

        gestureValue.textContent =
            "PEACE ✌️";

    }

    else if (
        spread > 55
    ) {

        gestureValue.textContent =
            "OPEN HAND 🖐️";

    }

    else {

        gestureValue.textContent =
            "FIST ✊";

    }

}


/* =========================================================
   PARTICLE BURST
========================================================= */

function createBurst(
    x,
    y,
    amount = 20
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const angle =
            Math.random() *
            Math.PI * 2;

        const speed =
            Math.random() * 8 + 2;


        particles.push({

            x: x,

            y: y,

            vx:
                Math.cos(angle) *
                speed,

            vy:
                Math.sin(angle) *
                speed,

            life: 1,

            size:
                Math.random() * 4 + 1,

            color:
                getColor(
                    i,
                    6
                )

        });

    }

}


/* =========================================================
   RIPPLE
========================================================= */

function createRipple(
    x,
    y,
    radius,
    maximum
) {

    ripples.push({

        x: x,

        y: y,

        radius: radius,

        maxRadius: maximum,

        life: 1,

        color:
            getColor(1,3)

    });

}


/* =========================================================
   MATRIX BACKGROUND
========================================================= */

function drawMatrix() {

    bg.fillStyle =
        "rgba(2,3,12,0.24)";

    bg.fillRect(
        0,
        0,
        width,
        height
    );


    bg.font =
        "16px monospace";


    for (
        let i = 0;
        i < matrixDrops.length;
        i++
    ) {

        if (
            Math.random() <
            0.055
        ) {

            bg.fillStyle =
                getColor(
                    i,
                    10
                );

            bg.globalAlpha =
                0.25;


            const character =
                String.fromCharCode(
                    0x30A0 +
                    Math.random() * 96
                );


            bg.fillText(
                character,
                i * 16,
                matrixDrops[i] * 16
            );

        }


        matrixDrops[i] +=
            1 +
            power / 70;


        if (
            matrixDrops[i] * 16 >
            height + 30
        ) {

            matrixDrops[i] =
                0;

        }

    }


    bg.globalAlpha =
        1;

}


/* =========================================================
   HAND AURA
========================================================= */

function drawHandAura(
    hand,
    index
) {

    const palm =
        canvasPoint(
            hand[0]
        );


    const color =
        getColor(
            index,
            5
        );


    const radius =
        70 +
        power * 0.9;


    const gradient =
        ctx.createRadialGradient(
            palm.x,
            palm.y,
            5,
            palm.x,
            palm.y,
            radius
        );


    gradient.addColorStop(
        0,
        "#ffffff66"
    );

    gradient.addColorStop(
        0.25,
        color + "55"
    );

    gradient.addColorStop(
        1,
        "#00000000"
    );


    ctx.fillStyle =
        gradient;


    ctx.beginPath();

    ctx.arc(
        palm.x,
        palm.y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================================================
   HAND SKELETON
========================================================= */

function drawHand(
    hand,
    handIndex
) {

    const connections = [

        [0,1],
        [1,2],
        [2,3],
        [3,4],

        [0,5],
        [5,6],
        [6,7],
        [7,8],

        [5,9],
        [9,10],
        [10,11],
        [11,12],

        [9,13],
        [13,14],
        [14,15],
        [15,16],

        [13,17],
        [17,18],
        [18,19],
        [19,20],

        [0,17]

    ];


    const handColor =
        getColor(
            handIndex,
            Math.max(
                2,
                currentHands.length
            )
        );


    ctx.strokeStyle =
        handColor;

    ctx.lineWidth =
        2.5;

    ctx.shadowBlur =
        18;

    ctx.shadowColor =
        handColor;


    connections.forEach(
        connection => {

            const a =
                canvasPoint(
                    hand[
                        connection[0]
                    ]
                );

            const b =
                canvasPoint(
                    hand[
                        connection[1]
                    ]
                );


            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );

            ctx.stroke();

        }
    );


    ctx.shadowBlur =
        0;


    /*
       FINGERTIPS
    */

    FINGER_TIPS.forEach(
        (
            tipIndex,
            fingerIndex
        ) => {

            const point =
                canvasPoint(
                    hand[
                        tipIndex
                    ]
                );


            const tipColor =
                getColor(
                    fingerIndex,
                    5
                );


            ctx.beginPath();

            ctx.arc(
                point.x,
                point.y,
                5 +
                power * 0.025,
                0,
                Math.PI * 2
            );


            ctx.fillStyle =
                "#ffffff";

            ctx.shadowBlur =
                25;

            ctx.shadowColor =
                tipColor;

            ctx.fill();


            ctx.shadowBlur =
                0;


            /*
               TRAIL
            */

            if (trailEnabled) {

                trails.push({

                    x: point.x,

                    y: point.y,

                    life: 1,

                    color:
                        tipColor

                });


                if (
                    trails.length >
                    1000
                ) {

                    trails.splice(
                        0,
                        100
                    );

                }

            }


            /*
               Tiny sparks
            */

            if (
                Math.random() <
                0.35
            ) {

                createBurst(
                    point.x,
                    point.y,
                    1
                );

            }

        }
    );

}


/* =========================================================
   FINGERTIP TRAILS
========================================================= */

function drawTrails() {

    for (
        let i =
            trails.length - 1;
        i >= 0;
        i--
    ) {

        const trail =
            trails[i];


        trail.life -=
            0.025;


        if (
            trail.life <= 0
        ) {

            trails.splice(
                i,
                1
            );

            continue;

        }


        ctx.globalAlpha =
            trail.life * 0.45;


        ctx.fillStyle =
            trail.color;


        ctx.shadowBlur =
            12;

        ctx.shadowColor =
            trail.color;


        ctx.beginPath();

        ctx.arc(
            trail.x,
            trail.y,
            2.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.globalAlpha =
        1;

    ctx.shadowBlur =
        0;

}


/* =========================================================
   PORTAL
========================================================= */

function drawPortal() {

    if (
        !portalEnabled ||
        currentHands.length < 2
    ) {

        return;

    }


    const hand1 =
        canvasPoint(
            currentHands[0][0]
        );

    const hand2 =
        canvasPoint(
            currentHands[1][0]
        );


    const centerX =
        (
            hand1.x +
            hand2.x
        ) / 2;


    const centerY =
        (
            hand1.y +
            hand2.y
        ) / 2;


    const handDistance =
        Math.hypot(
            hand1.x -
            hand2.x,

            hand1.y -
            hand2.y
        );


    const radius =
        Math.max(
            30,
            Math.min(
                230,
                handDistance * 0.42
            )
        );


    ctx.save();


    ctx.translate(
        centerX,
        centerY
    );


    ctx.rotate(
        time * 0.8
    );


    for (
        let i = 0;
        i < 5;
        i++
    ) {

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            radius +
            i * 12,
            0,
            Math.PI * 2
        );


        ctx.strokeStyle =
            getColor(
                i,
                5
            );

        ctx.lineWidth =
            3;


        ctx.globalAlpha =
            0.75 -
            i * 0.1;


        ctx.shadowBlur =
            25;

        ctx.shadowColor =
            ctx.strokeStyle;


        ctx.stroke();

    }


    ctx.restore();


    ctx.globalAlpha =
        1;

    ctx.shadowBlur =
        0;


    /*
       PORTAL SPARKS
    */

    if (
        handDistance < 300 &&
        Math.random() < 0.5
    ) {

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            createPortalSpark(
                hand1,
                hand2
            );

        }

    }

}


/* =========================================================
   PORTAL SPARK
========================================================= */

function createPortalSpark(
    a,
    b
) {

    const t =
        Math.random();


    const x =
        a.x +
        (
            b.x -
            a.x
        ) * t;


    const y =
        a.y +
        (
            b.y -
            a.y
        ) * t;


    sparks.push({

        x: x,

        y: y,

        vx:
            (Math.random() - 0.5) *
            6,

        vy:
            (Math.random() - 0.5) *
            6,

        life: 1,

        color:
            getColor(
                Math.floor(
                    Math.random() * 6
                ),
                8
            )

    });

}


/* =========================================================
   DRAW SPARKS
========================================================= */

function drawSparks() {

    for (
        let i =
            sparks.length - 1;
        i >= 0;
        i--
    ) {

        const spark =
            sparks[i];


        spark.x +=
            spark.vx;

        spark.y +=
            spark.vy;


        spark.life -=
            0.06;


        if (
            spark.life <= 0
        ) {

            sparks.splice(
                i,
                1
            );

            continue;

        }


        ctx.globalAlpha =
            spark.life;


        ctx.fillStyle =
            spark.color;


        ctx.shadowBlur =
            18;

        ctx.shadowColor =
            spark.color;


        ctx.beginPath();

        ctx.arc(
            spark.x,
            spark.y,
            2.5,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    ctx.globalAlpha =
        1;

    ctx.shadowBlur =
        0;

}


/* =========================================================
   MANDALA
========================================================= */

function drawMandala() {

    if (
        currentHands.length <
        2
    ) {

        return;

    }


    const points = [];


    currentHands.forEach(
        hand => {

            FINGER_TIPS.forEach(
                tip => {

                    points.push(
                        canvasPoint(
                            hand[tip]
                        )
                    );

                }
            );

        }
    );


    let centerX = 0;
    let centerY = 0;


    points.forEach(
        point => {

            centerX +=
                point.x;

            centerY +=
                point.y;

        }
    );


    centerX /=
        points.length;

    centerY /=
        points.length;


    ctx.save();


    ctx.translate(
        centerX,
        centerY
    );


    ctx.rotate(
        time * 0.4
    );


    ctx.strokeStyle =
        "rgba(255,255,255,0.22)";

    ctx.lineWidth =
        1;


    for (
        let i = 0;
        i < points.length;
        i++
    ) {

        const a =
            points[i];

        const b =
            points[
                (i + 3) %
                points.length
            ];


        ctx.beginPath();

        ctx.moveTo(
            a.x - centerX,
            a.y - centerY
        );

        ctx.lineTo(
            b.x - centerX,
            b.y - centerY
        );

        ctx.stroke();

    }


    ctx.restore();

}


/* =========================================================
   PHYSICS
========================================================= */

function updatePhysics() {

    /*
       PARTICLES
    */

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const particle =
            particles[i];


        particle.x +=
            particle.vx;

        particle.y +=
            particle.vy;


        particle.vx *=
            0.985;

        particle.vy =
            particle.vy *
            0.985 +
            0.08;


        particle.life -=
            0.025;


        if (
            particle.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.globalAlpha =
            particle.life;


        ctx.fillStyle =
            particle.color;


        ctx.shadowBlur =
            14;

        ctx.shadowColor =
            particle.color;


        ctx.beginPath();

        ctx.arc(
            particle.x,
            particle.y,
            particle.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

    }


    /*
       RIPPLES
    */

    for (
        let i =
            ripples.length - 1;
        i >= 0;
        i--
    ) {

        const ripple =
            ripples[i];


        ripple.radius +=
            (
                ripple.maxRadius -
                ripple.radius
            ) * 0.09;


        ripple.life -=
            0.025;


        if (
            ripple.life <= 0
        ) {

            ripples.splice(
                i,
                1
            );

            continue;

        }


        ctx.globalAlpha =
            ripple.life;


        ctx.strokeStyle =
            ripple.color;


        ctx.lineWidth =
            5 *
            ripple.life;


        ctx.shadowBlur =
            25;

        ctx.shadowColor =
            ripple.color;


        ctx.beginPath();

        ctx.arc(
            ripple.x,
            ripple.y,
            ripple.radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    ctx.globalAlpha =
        1;

    ctx.shadowBlur =
        0;

}


/* =========================================================
   MAIN RENDER LOOP
========================================================= */

function renderLoop(
    timestamp
) {

    const delta =
        (
            timestamp -
            lastFrame
        ) / 1000;


    lastFrame =
        timestamp;


    time +=
        delta;


    /*
       FPS
    */

    fpsFrames++;


    if (
        timestamp -
        fpsTimer >=
        1000
    ) {

        fpsValue.textContent =
            fpsFrames;

        fpsFrames =
            0;

        fpsTimer =
            timestamp;

    }


    /*
       Clear effect canvas
    */

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
       Background
    */

    drawMatrix();


    /*
       Trails
    */

    drawTrails();


    /*
       Hand aura
    */

    currentHands.forEach(
        (
            hand,
            index
        ) => {

            drawHandAura(
                hand,
                index
            );

        }
    );


    /*
       Skeleton
    */

    currentHands.forEach(
        (
            hand,
            index
        ) => {

            drawHand(
                hand,
                index
            );

        }
    );


    /*
       Portal
    */

    drawPortal();


    /*
       Mandala
    */

    drawMandala();


    /*
       Sparks
    */

    drawSparks();


    /*
       Physics
    */

    updatePhysics();


    /*
       Status
    */

    if (
        currentHands.length === 0
    ) {

        status.textContent =
            "Show your hand 🖐️";

    } else {

        status.textContent =
            `POWER ${
                Math.round(power)
            }% • ${
                gestureValue.textContent
            }`;

    }


    requestAnimationFrame(
        renderLoop
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (cameraStream) {

            cameraStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        }

    }
);

</script>
