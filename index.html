<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neon Aura AR - Hand Tracking</title>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<style>

:root {
    --accent: #00ffcc;
    --bg: #050510;
    --glass: rgba(10,15,30,0.55);
    --border: rgba(255,255,255,0.18);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================================
   CAMERA
========================================================= */

#video {
    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    object-fit: cover;

    display: block;

    background: #000;

    /*
       IMPORTANT:
       Camera must remain BELOW the canvases.
    */
    z-index: 1;

    transform: scaleX(-1);

    filter:
        brightness(0.78)
        contrast(1.05)
        saturate(1.05);
}

/* =========================================================
   BACKGROUND EFFECT
========================================================= */

#backgroundCanvas {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 2;

    pointer-events: none;

    transform: scaleX(-1);
}

/* =========================================================
   MAIN EFFECT CANVAS
========================================================= */

#effectCanvas {

    position: fixed;

    top: 0;
    left: 0;

    width: 100vw;
    height: 100vh;

    z-index: 3;

    pointer-events: none;

    transform: scaleX(-1);
}

/* =========================================================
   HUD
========================================================= */

#hud {

    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 20;

    display: flex;

    flex-direction: column;

    gap: 12px;

    transition: 0.4s;
}

.panel {

    min-width: 220px;

    padding: 16px 20px;

    border-radius: 16px;

    background: var(--glass);

    border: 1px solid var(--border);

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);

    box-shadow:
        0 10px 40px rgba(0,0,0,0.5),
        0 0 20px rgba(0,255,204,0.05);

}

.stat {

    display: flex;

    justify-content: space-between;

    gap: 30px;

    margin-bottom: 8px;

    color: rgba(255,255,255,0.85);

    font-size: 14px;
}

.stat:last-child {
    margin-bottom: 0;
}

.value {

    color: var(--accent);

    font-weight: bold;

    text-shadow:
        0 0 8px var(--accent);
}

/* =========================================================
   THEME BAR
========================================================= */

#themes {

    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    display: flex;

    gap: 7px;

    padding: 8px;

    border-radius: 40px;

    background: rgba(5,10,20,0.65);

    border: 1px solid var(--border);

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);

    white-space: nowrap;
}

.theme-btn {

    border: 1px solid transparent;

    background: transparent;

    color: white;

    padding: 9px 15px;

    border-radius: 25px;

    cursor: pointer;

    transition: 0.3s;

    font-size: 13px;

}

.theme-btn:hover {

    background: rgba(255,255,255,0.12);

}

.theme-btn.active {

    background: rgba(255,255,255,0.18);

    border-color: rgba(255,255,255,0.3);

    box-shadow:
        0 0 15px rgba(255,255,255,0.12);

}

/* =========================================================
   START SCREEN
========================================================= */

#startOverlay {

    position: fixed;

    inset: 0;

    z-index: 100;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(30,0,80,0.4),
            rgba(0,0,0,0.97)
        );

    backdrop-filter: blur(12px);

    transition: opacity 0.6s;
}

#startOverlay.hidden {

    opacity: 0;

    pointer-events: none;
}

.title {

    font-size: clamp(30px, 6vw, 70px);

    letter-spacing: 8px;

    font-weight: 300;

    margin-bottom: 20px;

    text-shadow:
        0 0 10px #00ffff,
        0 0 30px #ff00ff;
}

.subtitle {

    color: #aaa;

    max-width: 500px;

    line-height: 1.6;

    margin-bottom: 35px;

    padding: 0 20px;
}

#startBtn {

    border: none;

    padding: 16px 38px;

    border-radius: 40px;

    color: white;

    background:
        linear-gradient(
            45deg,
            #ff00cc,
            #3333ff
        );

    font-weight: bold;

    font-size: 16px;

    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 20px rgba(255,0,204,0.5);

    transition: 0.3s;
}

#startBtn:hover {

    transform: scale(1.06);

    box-shadow:
        0 0 35px rgba(255,0,204,0.8);
}

/* =========================================================
   STATUS
========================================================= */

#status {

    position: fixed;

    bottom: 85px;

    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    padding: 8px 16px;

    border-radius: 20px;

    background: rgba(0,0,0,0.45);

    color: rgba(255,255,255,0.7);

    font-size: 12px;

    backdrop-filter: blur(10px);
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    #hud {
        top: 10px;
        left: 10px;
    }

    .panel {
        min-width: 175px;
        padding: 11px 14px;
    }

    .stat {
        font-size: 12px;
    }

    #themes {
        bottom: 15px;

        max-width: 95vw;

        overflow-x: auto;
    }

    .theme-btn {
        padding: 8px 11px;
        font-size: 11px;
    }

}

</style>
</head>

<body>

<!-- =====================================================
     CAMERA
===================================================== -->

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<!-- =====================================================
     CANVASES
===================================================== -->

<canvas id="backgroundCanvas"></canvas>

<canvas id="effectCanvas"></canvas>


<!-- =====================================================
     HUD
===================================================== -->

<div id="hud">

    <div class="panel">

        <div class="stat">
            <span>Hands Detected</span>
            <span
                class="value"
                id="handsCount">
                0
            </span>
        </div>

        <div class="stat">
            <span>FPS</span>
            <span
                class="value"
                id="fps">
                0
            </span>
        </div>

    </div>


    <div class="panel">

        <div class="stat">
            <span>Gesture</span>
            <span
                class="value"
                id="gesture">
                None
            </span>
        </div>

        <div class="stat">
            <span>Spread</span>
            <span
                class="value"
                id="spread">
                0%
            </span>
        </div>

    </div>

</div>


<!-- =====================================================
     THEME BUTTONS
===================================================== -->

<div id="themes">

    <button
        class="theme-btn active"
        data-theme="Rainbow">
        🌈 Rainbow
    </button>

    <button
        class="theme-btn"
        data-theme="Cyberpunk">
        💜 Cyberpunk
    </button>

    <button
        class="theme-btn"
        data-theme="Lava">
        🔥 Lava
    </button>

    <button
        class="theme-btn"
        data-theme="Ocean">
        🌊 Ocean
    </button>

    <button
        class="theme-btn"
        data-theme="Galaxy">
        🌌 Galaxy
    </button>

</div>


<div id="status">
    Waiting for camera...
</div>


<!-- =====================================================
     START SCREEN
===================================================== -->

<div id="startOverlay">

    <div class="title">
        NEON AURA
    </div>

    <div class="subtitle">

        Advanced Hand Tracking AR Experience

        <br><br>

        Allow camera access and move your hands
        in front of the camera.

    </div>

    <button id="startBtn">
        ENTER EXPERIENCE
    </button>

</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById("video");

const bgCanvas =
    document.getElementById("backgroundCanvas");

const effectCanvas =
    document.getElementById("effectCanvas");

const bg =
    bgCanvas.getContext("2d");

const ctx =
    effectCanvas.getContext("2d");


const handsCount =
    document.getElementById("handsCount");

const fpsDisplay =
    document.getElementById("fps");

const gestureDisplay =
    document.getElementById("gesture");

const spreadDisplay =
    document.getElementById("spread");

const statusDisplay =
    document.getElementById("status");

const startOverlay =
    document.getElementById("startOverlay");

const startBtn =
    document.getElementById("startBtn");


/* =========================================================
   VARIABLES
========================================================= */

let width =
    window.innerWidth;

let height =
    window.innerHeight;

let currentHands = [];

let particles = [];

let ripples = [];

let lastTime =
    performance.now();

let time = 0;

let frames = 0;

let fpsTime =
    performance.now();

let cameraStream = null;

let mediaPipeHands = null;

let camera = null;


/* =========================================================
   THEMES
========================================================= */

let currentTheme = "Rainbow";

const themes = {

    Rainbow: function(t,index,total) {

        return `
            hsl(
                ${(t * 100 + index * (360 / total)) % 360},
                100%,
                60%
            )
        `;
    },

    Cyberpunk: function(t,index,total) {

        return index % 2 === 0
            ? "#ff0088"
            : "#00ffff";
    },

    Lava: function(t,index,total) {

        return `
            hsl(
                ${10 + index * 8},
                100%,
                ${55 + Math.sin(t) * 10}%
            )
        `;
    },

    Ocean: function(t,index,total) {

        return `
            hsl(
                ${180 + index * 15},
                100%,
                60%
            )
        `;
    },

    Galaxy: function(t,index,total) {

        return `
            hsl(
                ${260 + Math.sin(t * 2 + index) * 40},
                100%,
                65%
            )
        `;
    }

};


/* =========================================================
   RESIZE
========================================================= */

function resize() {

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    bgCanvas.width =
        width;

    bgCanvas.height =
        height;

    effectCanvas.width =
        width;

    effectCanvas.height =
        height;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =========================================================
   THEME SWITCHING
========================================================= */

document
.querySelectorAll(".theme-btn")
.forEach(button => {

    button.addEventListener(
        "click",
        () => {

            document
            .querySelectorAll(".theme-btn")
            .forEach(btn =>
                btn.classList.remove("active")
            );

            button.classList.add("active");

            currentTheme =
                button.dataset.theme;

            document.documentElement
            .style
            .setProperty(
                "--accent",
                themes[currentTheme](
                    time,
                    1,
                    5
                )
            );
        }
    );

});


/* =========================================================
   START EXPERIENCE
========================================================= */

startBtn.addEventListener(
    "click",
    startExperience
);


async function startExperience() {

    startBtn.disabled = true;

    startBtn.innerText =
        "STARTING...";

    statusDisplay.innerText =
        "Requesting camera permission...";

    try {

        /* =========================================
           CAMERA
        ========================================= */

        cameraStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                },

                audio: false

            });


        /* =========================================
           CONNECT CAMERA TO VIDEO
        ========================================= */

        video.srcObject =
            cameraStream;

        video.muted =
            true;

        video.playsInline =
            true;

        video.style.display =
            "block";


        /* =========================================
           WAIT FOR VIDEO
        ========================================= */

        await new Promise(
            resolve => {

                if (
                    video.readyState >= 2
                ) {

                    resolve();

                } else {

                    video.onloadedmetadata =
                        () => resolve();

                }

            }
        );


        await video.play();


        console.log(
            "Camera started:",
            video.videoWidth,
            "x",
            video.videoHeight
        );


        statusDisplay.innerText =
            "Camera active • Show your hand";


        /* =========================================
           START MEDIAPIPE
        ========================================= */

        initMediaPipe();


        /* =========================================
           HIDE START SCREEN
        ========================================= */

        setTimeout(() => {

            startOverlay.classList.add(
                "hidden"
            );

        }, 300);


        /* =========================================
           START RENDER LOOP
        ========================================= */

        requestAnimationFrame(
            renderLoop
        );

    }

    catch(error) {

        console.error(
            "Camera error:",
            error
        );

        statusDisplay.innerText =
            "Camera permission denied or unavailable";

        startBtn.disabled =
            false;

        startBtn.innerText =
            "TRY AGAIN";

        alert(
            "Camera could not be started.\n\n" +
            "Please allow camera permission and reload the page."
        );

    }

}


/* =========================================================
   MEDIAPIPE
========================================================= */

function initMediaPipe() {

    mediaPipeHands =
        new Hands({

            locateFile: function(file) {

                return `
                    https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}
                `;

            }

        });


    mediaPipeHands.setOptions({

        maxNumHands: 2,

        modelComplexity: 1,

        minDetectionConfidence: 0.6,

        minTrackingConfidence: 0.6

    });


    mediaPipeHands.onResults(
        onHandsResults
    );


    camera =
        new Camera(
            video,
            {

                onFrame: async function() {

                    try {

                        await mediaPipeHands
                            .send({
                                image: video
                            });

                    }

                    catch(error) {

                        console.error(
                            "MediaPipe error:",
                            error
                        );

                    }

                },

                width: 1280,

                height: 720,

                facingMode: "user"

            }
        );


    camera.start();

}


/* =========================================================
   HAND RESULTS
========================================================= */

function onHandsResults(results) {

    currentHands =
        results.multiHandLandmarks || [];


    handsCount.innerText =
        currentHands.length;


    if (
        currentHands.length > 0
    ) {

        statusDisplay.innerText =
            "Hand detected • Move your hand";

    }

    else {

        statusDisplay.innerText =
            "Camera active • Show your hand";

    }

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b) {

    return Math.sqrt(

        Math.pow(
            a.x - b.x,
            2
        )

        +

        Math.pow(
            a.y - b.y,
            2
        )

    );

}


/* =========================================================
   MAP HAND TO SCREEN
========================================================= */

function mapPoint(point) {

    return {

        x: point.x * width,

        y: point.y * height

    };

}


/* =========================================================
   PARTICLES
========================================================= */

function createParticles(
    x,
    y,
    color,
    amount = 2
) {

    for (
        let i = 0;
        i < amount;
        i++
    ) {

        particles.push({

            x: x,

            y: y,

            vx:
                (Math.random() - 0.5)
                * 5,

            vy:
                (Math.random() - 0.5)
                * 5,

            life: 1,

            size:
                Math.random() * 3 + 1,

            color: color

        });

    }

}


/* =========================================================
   SHOCKWAVE
========================================================= */

function shockwave(
    x,
    y,
    color
) {

    ripples.push({

        x: x,

        y: y,

        radius: 5,

        maxRadius:
            120 +
            Math.random() * 120,

        life: 1,

        color: color

    });

}


/* =========================================================
   GESTURE DETECTION
========================================================= */

let previousPinch =
    [false,false];


function detectGestures() {

    if (
        currentHands.length === 0
    ) {

        gestureDisplay.innerText =
            "None";

        spreadDisplay.innerText =
            "0%";

        return;

    }


    let pinching =
        false;


    currentHands.forEach(
        (hand,index) => {

            const thumb =
                hand[4];

            const indexFinger =
                hand[8];


            const d =
                distance(
                    thumb,
                    indexFinger
                );


            const isPinching =
                d < 0.055;


            if (
                isPinching &&
                !previousPinch[index]
            ) {

                const point = {

                    x:
                        (
                            thumb.x +
                            indexFinger.x
                        ) / 2,

                    y:
                        (
                            thumb.y +
                            indexFinger.y
                        ) / 2

                };


                const screenPoint =
                    mapPoint(point);


                shockwave(

                    screenPoint.x,

                    screenPoint.y,

                    themes[currentTheme](
                        time,
                        index,
                        5
                    )

                );


                createParticles(

                    screenPoint.x,

                    screenPoint.y,

                    themes[currentTheme](
                        time,
                        index,
                        5
                    ),

                    15

                );

            }


            previousPinch[index] =
                isPinching;


            if (isPinching) {

                pinching = true;

            }

        }
    );


    if (pinching) {

        gestureDisplay.innerText =
            "PINCH";

    }

    else {

        gestureDisplay.innerText =
            "Open Hand";

    }


    /* =========================================
       SPREAD
    ========================================= */

    const hand =
        currentHands[0];


    const spread =
        distance(
            hand[8],
            hand[20]
        );


    const percentage =
        Math.min(
            Math.round(
                spread * 300
            ),
            100
        );


    spreadDisplay.innerText =
        percentage + "%";

}


/* =========================================================
   BACKGROUND
========================================================= */

let matrixDrops = [];

function initMatrix() {

    const columns =
        Math.floor(
            width / 18
        );

    matrixDrops =
        new Array(columns)
        .fill(0)
        .map(
            () =>
                Math.random()
                * height
        );

}


initMatrix();


function drawBackground() {

    /* Slight transparent fade */

    bg.fillStyle =
        "rgba(2,3,12,0.08)";

    bg.fillRect(
        0,
        0,
        width,
        height
    );


    bg.font =
        "16px monospace";


    for (
        let i = 0;
        i < matrixDrops.length;
        i++
    ) {

        if (
            Math.random() > 0.93
        ) {

            const char =
                String.fromCharCode(
                    0x30A0 +
                    Math.random() * 96
                );


            bg.fillStyle =
                themes[currentTheme](
                    time,
                    i,
                    matrixDrops.length
                );


            bg.fillText(

                char,

                i * 18,

                matrixDrops[i]

            );

        }


        matrixDrops[i] +=
            1.5;


        if (
            matrixDrops[i] >
            height
        ) {

            matrixDrops[i] =
                0;

        }

    }

}


/* =========================================================
   PARTICLE UPDATE
========================================================= */

function updateParticles() {

    for (
        let i = particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];


        p.x += p.vx;

        p.y += p.vy;

        p.vy += 0.05;

        p.life -= 0.018;


        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();


        ctx.globalAlpha =
            p.life;


        ctx.shadowBlur =
            15;

        ctx.shadowColor =
            p.color;


        ctx.fillStyle =
            p.color;


        ctx.beginPath();


        ctx.arc(

            p.x,

            p.y,

            p.size,

            0,

            Math.PI * 2

        );


        ctx.fill();


        ctx.restore();

    }

}


/* =========================================================
   SHOCKWAVES
========================================================= */

function updateShockwaves() {

    for (
        let i = ripples.length - 1;
        i >= 0;
        i--
    ) {

        const r =
            ripples[i];


        r.radius +=
            (r.maxRadius -
             r.radius)
            * 0.08;


        r.life -=
            0.025;


        if (
            r.life <= 0
        ) {

            ripples.splice(
                i,
                1
            );

            continue;

        }


        ctx.save();


        ctx.globalAlpha =
            r.life;


        ctx.strokeStyle =
            r.color;


        ctx.shadowBlur =
            25;

        ctx.shadowColor =
            r.color;


        ctx.lineWidth =
            4;


        ctx.beginPath();


        ctx.arc(

            r.x,

            r.y,

            r.radius,

            0,

            Math.PI * 2

        );


        ctx.stroke();


        ctx.restore();

    }

}


/* =========================================================
   DRAW HANDS
========================================================= */

const fingerTips =
    [4,8,12,16,20];


function drawHands() {

    if (
        currentHands.length === 0
    ) {

        return;

    }


    currentHands.forEach(
        (hand,handIndex) => {

            const color =
                themes[currentTheme](
                    time,
                    handIndex,
                    2
                );


            /* =====================================
               SKELETON
            ===================================== */

            ctx.save();


            ctx.shadowBlur =
                15;

            ctx.shadowColor =
                color;


            drawConnectors(

                ctx,

                hand,

                HAND_CONNECTIONS,

                {

                    color: color,

                    lineWidth: 3

                }

            );


            ctx.restore();


            /* =====================================
               LANDMARKS
            ===================================== */

            fingerTips.forEach(
                (tip,index) => {

                    const point =
                        mapPoint(
                            hand[tip]
                        );


                    const tipColor =
                        themes[currentTheme](
                            time,
                            index,
                            5
                        );


                    ctx.save();


                    ctx.shadowBlur =
                        25;

                    ctx.shadowColor =
                        tipColor;


                    ctx.fillStyle =
                        "#ffffff";


                    ctx.beginPath();


                    ctx.arc(

                        point.x,

                        point.y,

                        5,

                        0,

                        Math.PI * 2

                    );


                    ctx.fill();


                    ctx.restore();


                    /* particles */

                    if (
                        Math.random() >
                        0.7
                    ) {

                        createParticles(

                            point.x,

                            point.y,

                            tipColor,

                            1

                        );

                    }

                }

            );

        }
    );


    /* =====================================================
       TWO-HAND CONNECTION
    ===================================================== */

    if (
        currentHands.length >= 2
    ) {

        const hand1 =
            currentHands[0];

        const hand2 =
            currentHands[1];


        fingerTips.forEach(
            (tip,index) => {

                const p1 =
                    mapPoint(
                        hand1[tip]
                    );

                const p2 =
                    mapPoint(
                        hand2[tip]
                    );


                const color =
                    themes[currentTheme](
                        time,
                        index,
                        5
                    );


                ctx.save();


                ctx.shadowBlur =
                    20;

                ctx.shadowColor =
                    color;


                ctx.strokeStyle =
                    color;


                ctx.lineWidth =
                    3;


                ctx.beginPath();


                ctx.moveTo(
                    p1.x,
                    p1.y
                );


                ctx.lineTo(
                    p2.x,
                    p2.y
                );


                ctx.stroke();


                ctx.restore();

            }
        );


        /* =================================================
           MANDALA
        ================================================= */

        const points = [];


        fingerTips.forEach(
            tip => {

                points.push(
                    mapPoint(
                        hand1[tip]
                    )
                );

            }
        );


        fingerTips.forEach(
            tip => {

                points.push(
                    mapPoint(
                        hand2[tip]
                    )
                );

            }
        );


        let centerX = 0;

        let centerY = 0;


        points.forEach(
            p => {

                centerX +=
                    p.x;

                centerY +=
                    p.y;

            }
        );


        centerX /=
            points.length;

        centerY /=
            points.length;


        ctx.save();


        ctx.translate(
            centerX,
            centerY
        );


        ctx.rotate(
            time * 0.5
        );


        ctx.strokeStyle =
            "rgba(255,255,255,0.25)";


        ctx.lineWidth =
            1;


        for (
            let i = 0;
            i < points.length;
            i++
        ) {

            const a =
                points[i];

            const b =
                points[
                    (i + 3)
                    % points.length
                ];


            ctx.beginPath();


            ctx.moveTo(

                a.x - centerX,

                a.y - centerY

            );


            ctx.lineTo(

                b.x - centerX,

                b.y - centerY

            );


            ctx.stroke();

        }


        ctx.restore();

    }

}


/* =========================================================
   MAIN RENDER LOOP
========================================================= */

function renderLoop(timestamp) {

    const delta =
        (timestamp -
         lastTime) / 1000;


    lastTime =
        timestamp;


    time +=
        delta;


    /* FPS */

    frames++;


    if (
        timestamp -
        fpsTime >=
        1000
    ) {

        fpsDisplay.innerText =
            frames;

        frames = 0;

        fpsTime =
            timestamp;

    }


    /* Background */

    drawBackground();


    /* Fade effect canvas */

    ctx.globalCompositeOperation =
        "destination-out";


    ctx.fillStyle =
        "rgba(0,0,0,0.16)";


    ctx.fillRect(

        0,

        0,

        width,

        height

    );


    ctx.globalCompositeOperation =
        "source-over";


    /* Effects */

    updateParticles();

    updateShockwaves();

    drawHands();

    detectGestures();


    requestAnimationFrame(
        renderLoop
    );

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }

    }
);


/* =========================================================
   INITIAL MESSAGE
========================================================= */

console.log(
    "Neon Aura AR loaded successfully."
);

</script>
